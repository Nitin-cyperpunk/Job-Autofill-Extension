    <!--
      Mirrors the markup patterns of Google Forms: questions in role="listitem",
      titles in role="heading" linked via aria-labelledby, ARIA radios / checkboxes /
      listbox made of divs, obfuscated class names and no name attributes.
    -->
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        max-width: 640px;
        margin: 2rem auto;
      }
      [role='listitem'] {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      [role='radio'],
      [role='checkbox'] {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #555;
        margin-right: 6px;
      }
      [role='radio'] {
        border-radius: 50%;
      }
      [role='option'] {
        padding: 2px 4px;
      }
    </style>
  </head>

    <script>
      // Minimal stand-in for Google Forms' widget behaviour: ARIA radios and
      // checkboxes toggle aria-checked on click (the real site does this too).
      document.addEventListener('click', (e) => {
        const radio = e.target.closest('[role="radio"]');
        if (radio) {
          radio
            .closest('[role="radiogroup"]')
            .querySelectorAll('[role="radio"]')
            .forEach((r) => r.setAttribute('aria-checked', String(r === radio)));
        }
        const box = e.target.closest('[role="checkbox"]');
        if (box)
          box.setAttribute('aria-checked', String(box.getAttribute('aria-checked') !== 'true'));
      });
      document.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        window.__submitted = true;
      });
    </script>
